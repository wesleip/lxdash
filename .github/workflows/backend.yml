# Backend CI — single workflow, named steps.
# 5 jobs run in parallel; every step has a `name:` so the Actions log
# shows clear sections (easy to skim, easy to grep, easy to point at a
# failed step in a review).
#
# Branch protection: all five job names below must be marked required
# in repo settings. See CONTRIBUTING.md.

name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend/Dockerfile*"
      - "backend/requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "backend/Dockerfile*"
      - "backend/requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1/5  Static analysis: ruff lint + format
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff 0.7.4 (pinned)
        run: pip install ruff==0.7.4

      - name: Run ruff check (lint rules)
        run: ruff check backend/

      - name: Run ruff format --check (style drift)
        run: ruff format --check backend/

  # ---------------------------------------------------------------------------
  # 2/5  Static analysis: bandit security scan
  # ---------------------------------------------------------------------------
  bandit:
    name: bandit (security scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit 1.7.10 (pinned)
        run: pip install bandit==1.7.10

      - name: Scan backend/ with bandit (medium+ severity)
        # B101 (assert) is excluded in backend/pyproject.toml.
        run: bandit -r backend/ -ll

  # ---------------------------------------------------------------------------
  # 3/5  Dockerfile lint: hadolint
  # ---------------------------------------------------------------------------
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint backend/Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # 4/5  Tests: pytest
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Install dev/test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest with short tracebacks
        run: cd backend && pytest --tb=short

  # ---------------------------------------------------------------------------
  # 5/5  Image vulnerability scan: build + trivy + SARIF
  #
  # depends on every fast check (ruff, bandit, hadolint, pytest) so that a
  # failure in any of them skips the slowest job. Free-plan quota saver:
  # trivy pulls a base image, builds the backend, and scans \xE2\x80\x94 it's the
  # most expensive step in the workflow. Running it after a guaranteed
  # failure would waste minutes for no information.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy (image vulnerability scan)
    needs: [ruff, bandit, hadolint, pytest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image (no push)
        run: docker build -t lxdash-backend:ci -f backend/Dockerfile backend/

      - name: Trivy scan (CRITICAL + HIGH, fail the run)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lxdash-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload SARIF as workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif