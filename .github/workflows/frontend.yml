# Frontend CI — single workflow, named steps.
# 5 jobs run in parallel; every step has a `name:` so the Actions log
# shows clear sections.
#
# Branch protection: all five job names below must be marked required
# in repo settings. See CONTRIBUTING.md.

name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "nginx/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "nginx/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1/5  Static analysis: eslint
  # ---------------------------------------------------------------------------
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci, from lockfile)
        run: cd frontend && npm ci

      - name: Run eslint via npm run lint
        run: cd frontend && npm run lint

  # ---------------------------------------------------------------------------
  # 2/5  Static analysis: tsc --noEmit (type check)
  # ---------------------------------------------------------------------------
  type-check:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci, from lockfile)
        run: cd frontend && npm ci

      - name: Run tsc --noEmit (no JS emitted, type errors only)
        run: cd frontend && npm run type-check

  # ---------------------------------------------------------------------------
  # 3/5  Tests: vitest
  # ---------------------------------------------------------------------------
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci, from lockfile)
        run: cd frontend && npm ci

      - name: Run vitest (single-shot)
        run: cd frontend && npm test

  # ---------------------------------------------------------------------------
  # 4/5  Dockerfile lint: hadolint on nginx/Dockerfile
  # ---------------------------------------------------------------------------
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint nginx/Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: nginx/Dockerfile
          # Tell hadolint to read .hadolint.yaml (where we ignore DL3008).
          # v3.x does not auto-load it from the workspace root.
          config: .hadolint.yaml
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # 5/5  Image vulnerability scan: build nginx + trivy + SARIF
  #
  # depends on every fast check (eslint, type-check, vitest, hadolint)
  # so that a failure in any of them skips the slowest job. Free-plan
  # quota saver: trivy pulls a base image, runs the multi-stage Node
  # build, and scans \xE2\x80\x94 the most expensive step in this workflow. Running
  # it after a guaranteed failure would waste minutes for no
  # information.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy (image vulnerability scan)
    needs: [eslint, type-check, vitest, hadolint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build nginx image (embeds the frontend bundle)
        run: docker build -t lxdash-nginx:ci -f nginx/Dockerfile .

      - name: Trivy scan (CRITICAL + HIGH, fail the run)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lxdash-nginx:ci
          format: sarif
          output: trivy-nginx.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload SARIF as workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-nginx-sarif
          path: trivy-nginx.sarif

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-nginx.sarif