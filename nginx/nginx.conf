# Rate-limit zone for auth endpoints (10 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Auth endpoints — rate-limited
    # Browser calls: /api/auth/...  →  backend: /auth/...
    # ---------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # REST API proxy
    # Browser calls: /api/...  →  backend: /...  (strips /api/ prefix)
    # proxy_buffering off is required for SSE (metrics stream).
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Needed for SSE (metrics endpoint streams indefinitely)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ---------------------------------------------------------------------------
    # WebSocket proxy
    # Browser opens: ws://host/ws/...  →  backend: /ws/...  (path kept as-is)
    # ---------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------------
    # Frontend SPA — serve static files with fallback to index.html
    # ---------------------------------------------------------------------------
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache hashed assets aggressively; never cache index.html
        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------------------
    # TLS — uncomment and configure to enable HTTPS
    # ---------------------------------------------------------------------------
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    # Redirect HTTP → HTTPS
    # if ($scheme = http) { return 301 https://$host$request_uri; }
}
